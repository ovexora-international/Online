<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Vexora Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0d0d14;--card:#161622;--border:#22223a;--accent:#7c6fff;--green:#2ecc71;--red:#e74c3c;--yellow:#f39c12;--text:#eaeaf5;--muted:#6b6b8a;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;}

/* ── LOGIN ── */
#loginScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#1a1040,#0d0d14);}
.logo{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,#7c6fff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;text-align:center;}
.logo-sub{color:var(--muted);font-size:.8rem;margin-bottom:36px;text-align:center;}
.inp{width:100%;padding:14px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;color:var(--text);font-size:1rem;margin-bottom:12px;outline:none;}
.inp:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:15px;background:linear-gradient(135deg,#7c6fff,#9b59b6);border:none;border-radius:14px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:4px;}
.err{color:var(--red);font-size:.85rem;margin-top:10px;text-align:center;display:none;}

/* ── APP ── */
#app{display:none;padding-bottom:72px;}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-size:1.1rem;font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.refresh-btn{background:var(--border);border:none;color:var(--text);padding:7px 12px;border-radius:10px;font-size:.85rem;cursor:pointer;}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;cursor:pointer;color:var(--muted);font-size:.62rem;font-weight:600;gap:4px;transition:color .2s;}
.bnav-item .ico{font-size:1.3rem;}
.bnav-item.active{color:var(--accent);}

/* PAGES */
.page{display:none;padding:14px;animation:fadeIn .2s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;}
.stat-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.stat-val{font-size:1.6rem;font-weight:800;}
.stat-sub{font-size:.68rem;margin-top:3px;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;}
.card-hdr{padding:13px 14px;border-bottom:1px solid var(--border);font-size:.88rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
.card-body{padding:14px;}

/* USER ROW */
.urow{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:8px;}
.urow-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.urow-name{font-size:.95rem;font-weight:700;}
.urow-id{font-size:.72rem;color:var(--muted);}
.urow-info{font-size:.78rem;color:var(--muted);margin-bottom:8px;}
.urow-btns{display:flex;gap:6px;flex-wrap:wrap;}

/* WITHDRAWAL ROW */
.wrow{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:8px;}
.wrow-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.wrow-uid{font-size:.88rem;font-weight:700;}
.wrow-amt{font-size:1rem;font-weight:800;color:var(--green);}
.wrow-info{font-size:.75rem;color:var(--muted);margin-bottom:8px;}
.wrow-btns{display:flex;gap:6px;}

/* TASK ROW */
.trow{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:8px;}
.trow-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.trow-name{font-size:.88rem;font-weight:700;}
.trow-info{font-size:.75rem;color:var(--muted);margin-bottom:8px;}
.trow-btns{display:flex;gap:6px;align-items:center;}

/* BADGES */
.badge{padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700;}
.b-green{background:#2ecc7122;color:#2ecc71;border:1px solid #2ecc7144;}
.b-red{background:#e74c3c22;color:#e74c3c;border:1px solid #e74c3c44;}
.b-yellow{background:#f39c1222;color:#f39c12;border:1px solid #f39c1244;}
.b-blue{background:#7c6fff22;color:#7c6fff;border:1px solid #7c6fff44;}
.b-pink{background:#ff6b9d22;color:#ff6b9d;border:1px solid #ff6b9d44;}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:10px;font-size:.78rem;font-weight:700;border:none;cursor:pointer;font-family:inherit;}
.btn-green{background:#2ecc7122;color:#2ecc71;border:1px solid #2ecc7144;}
.btn-green:active{background:#2ecc71;color:#000;}
.btn-red{background:#e74c3c22;color:#e74c3c;border:1px solid #e74c3c44;}
.btn-red:active{background:#e74c3c;color:#fff;}
.btn-blue{background:#7c6fff22;color:#7c6fff;border:1px solid #7c6fff44;}
.btn-blue:active{background:#7c6fff;color:#fff;}
.btn-yellow{background:#f39c1222;color:#f39c12;border:1px solid #f39c1244;}
.btn-yellow:active{background:#f39c12;color:#000;}
.btn-full{width:100%;padding:14px;border-radius:14px;font-size:1rem;font-weight:700;background:linear-gradient(135deg,#7c6fff,#9b59b6);border:none;color:#fff;cursor:pointer;margin-top:6px;}

/* SEARCH */
.search-box{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.search-box input{background:transparent;border:none;outline:none;color:var(--text);font-size:.9rem;flex:1;}

/* FORM */
.form-group{margin-bottom:12px;}
.form-label{font-size:.75rem;color:var(--muted);margin-bottom:5px;display:block;}
.form-inp{width:100%;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:.9rem;outline:none;}
.form-inp:focus{border-color:var(--accent);}
.form-select{width:100%;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:.9rem;outline:none;appearance:none;}

/* USER INFO BOX */
.user-found{background:var(--bg);border:1.5px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:14px;display:none;}
.user-found-name{font-size:1rem;font-weight:700;margin-bottom:6px;}
.user-found-info{font-size:.8rem;color:var(--muted);line-height:1.9;}

/* LOADING / EMPTY */
.loading{text-align:center;padding:36px;color:var(--muted);}
.spin{display:inline-block;width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:8px;}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px;color:var(--muted);font-size:.9rem;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:#000000bb;z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--card);border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:1rem;font-weight:800;margin-bottom:18px;}
.modal-btns{display:flex;gap:10px;margin-top:12px;}
.modal-cancel{flex:1;padding:13px;background:var(--border);border:none;border-radius:12px;color:var(--text);font-size:.9rem;font-weight:600;cursor:pointer;}
.modal-save{flex:1;padding:13px;background:linear-gradient(135deg,#7c6fff,#9b59b6);border:none;border-radius:12px;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;}

/* TOAST */
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 20px;font-size:.85rem;z-index:999;white-space:nowrap;display:none;box-shadow:0 8px 30px #00000077;}
.toast.show{display:block;animation:fadeIn .3s ease;}
.toast.ok{border-color:#2ecc7166;color:#2ecc71;}
.toast.fail{border-color:#e74c3c66;color:#e74c3c;}

/* PROOF IMAGE */
.proof-link{color:var(--accent);text-decoration:none;font-size:.78rem;}

/* SECTION TITLE */
.sec-title{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px;font-weight:700;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div style="width:100%;max-width:380px;">
    <div class="logo">⬡ VEXORA</div>
    <div class="logo-sub">Admin Panel</div>
    <input class="inp" type="text" id="lu" placeholder="Username" autocomplete="off"/>
    <input class="inp" type="password" id="lp" placeholder="Password"/>
    <button class="login-btn" id="lbtn" onclick="doLogin()">Login</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-title" id="pageTitle">📊 Dashboard</div>
    <div class="topbar-right">
      <button class="refresh-btn" onclick="refreshPage()">↻ Refresh</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="page active" id="page-dash">
    <div id="dashContent"><div class="loading"><div class="spin"></div><br>Loading...</div></div>
  </div>

  <!-- USERS -->
  <div class="page" id="page-users">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="uSearch" placeholder="Search name, ID, phone..." oninput="filterUsers()"/>
    </div>
    <div id="usersContent"><div class="loading"><div class="spin"></div><br>Loading...</div></div>
  </div>

  <!-- WITHDRAWALS -->
  <div class="page" id="page-with">
    <div id="withContent"><div class="loading"><div class="spin"></div><br>Loading...</div></div>
  </div>

  <!-- TASKS -->
  <div class="page" id="page-tasks">
    <div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;">
      <button class="btn btn-blue" id="tabAll" onclick="filterTasks('all')">All</button>
      <button class="btn" id="tabYT" onclick="filterTasks('YouTube')" style="background:#e74c3c22;color:#e74c3c;border:1px solid #e74c3c44;">▶ YouTube</button>
      <button class="btn" id="tabFB" onclick="filterTasks('Facebook')" style="background:#7c6fff22;color:#7c6fff;border:1px solid #7c6fff44;">👍 Facebook</button>
      <button class="btn" id="tabTK" onclick="filterTasks('TikTok')" style="background:#ff6b9d22;color:#ff6b9d;border:1px solid #ff6b9d44;">🎵 TikTok</button>
    </div>
    <div id="tasksContent"><div class="loading"><div class="spin"></div><br>Loading...</div></div>
  </div>

  <!-- REWARD -->
  <div class="page" id="page-reward">
    <div class="sec-title">User Search</div>
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="rwSearch" placeholder="User ID daalo (VX0001...)"/>
      <button class="btn btn-blue" onclick="searchRewardUser()" style="padding:6px 12px;">Go</button>
    </div>
    <div class="user-found" id="rwUserBox"></div>
    <div id="rwForm" style="display:none;">
      <div class="form-group">
        <label class="form-label">Reward Type</label>
        <select class="form-select" id="rwType">
          <option value="Bonus">🎉 Bonus</option>
          <option value="Salary">💼 Salary</option>
          <option value="Coin">🪙 Coin</option>
          <option value="TaskReward">✅ Task Reward</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Amount (Rs.)</label>
        <input class="form-inp" type="number" id="rwAmt" placeholder="100"/>
      </div>
      <button class="btn-full" onclick="sendReward()">💸 Send Reward</button>
    </div>
    <div class="sec-title" style="margin-top:20px;">Direct Balance Set</div>
    <div class="card card-body" style="padding:14px;">
      <div class="form-group">
        <label class="form-label">User ID</label>
        <input class="form-inp" type="text" id="balUid" placeholder="VX0001"/>
      </div>
      <div class="form-group">
        <label class="form-label">New Balance (Rs.)</label>
        <input class="form-inp" type="number" id="balAmt" placeholder="0"/>
      </div>
      <button class="btn-full" onclick="updateBalance()">💾 Set Balance</button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bnav">
    <div class="bnav-item active" data-page="dash" onclick="goPage(this,'dash','📊 Dashboard')">
      <span class="ico">📊</span>Dashboard
    </div>
    <div class="bnav-item" data-page="users" onclick="goPage(this,'users','👥 Users')">
      <span class="ico">👥</span>Users
    </div>
    <div class="bnav-item" data-page="with" onclick="goPage(this,'with','💸 Withdrawals')">
      <span class="ico">💸</span>W/D
    </div>
    <div class="bnav-item" data-page="tasks" onclick="goPage(this,'tasks','✅ Tasks')">
      <span class="ico">✅</span>Tasks
    </div>
    <div class="bnav-item" data-page="reward" onclick="goPage(this,'reward','🎁 Rewards')">
      <span class="ico">🎁</span>Rewards
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-title" id="mTitle"></div>
    <div id="mBody"></div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-save" id="mSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════
//  CONFIG
// ════════════════════════════
const GAS = "YOUR_GAS_URL_HERE"; // ← Apna GAS URL yahan

// ════════════════════════════
//  LOGIN
// ════════════════════════════
async function doLogin() {
  const u = gi('lu').value.trim();
  const p = gi('lp').value.trim();
  const err = gi('lerr');
  const btn = gi('lbtn');
  if (!u||!p){err.textContent='Username aur password daalen';err.style.display='block';return;}
  btn.textContent='...'; btn.disabled=true; err.style.display='none';
  try {
    const d = await gGet('admin_login',{user:u,pass:p});
    if (d.success && d.token) {
      sessionStorage.setItem('vxt', d.token);
      gi('loginScreen').style.display='none';
      gi('app').style.display='block';
      loadDash();
    } else {
      err.textContent='❌ '+(d.error||'Login failed');
      err.style.display='block';
    }
  } catch(e){err.textContent='❌ Connection error';err.style.display='block';}
  btn.textContent='Login'; btn.disabled=false;
}
gi('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
gi('lu').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// ════════════════════════════
//  NAVIGATION
// ════════════════════════════
let currentPage = 'dash';
function goPage(el, page, title) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.bnav-item').forEach(n=>n.classList.remove('active'));
  gi('page-'+page).classList.add('active');
  el.classList.add('active');
  gi('pageTitle').textContent = title;
  currentPage = page;
  if(page==='users' && !usersData.length) loadUsers();
  if(page==='with')  loadWith();
  if(page==='tasks' && !tasksData.length) loadTasks();
}

function refreshPage() {
  if(currentPage==='dash')  loadDash();
  if(currentPage==='users') loadUsers();
  if(currentPage==='with')  loadWith();
  if(currentPage==='tasks') loadTasks();
}

// ════════════════════════════
//  API
// ════════════════════════════
const tok = ()=> sessionStorage.getItem('vxt')||'';

async function gGet(action, params={}) {
  const qs = new URLSearchParams({action, token:tok(), ...params});
  const r  = await fetch(`${GAS}?${qs}`);
  const d  = await r.json();
  if(d.code===401){doLogout();} return d;
}
async function gPost(payload) {
  const r = await fetch(GAS,{method:'POST',body:JSON.stringify({...payload,token:tok()})});
  const d = await r.json();
  if(d.code===401){doLogout();} return d;
}
function doLogout(){
  sessionStorage.removeItem('vxt');
  gi('app').style.display='none';
  gi('loginScreen').style.display='flex';
}

// ════════════════════════════
//  DASHBOARD
// ════════════════════════════
async function loadDash() {
  gi('dashContent').innerHTML = loading();
  const r = await gGet('admin_dashboard');
  const s = r.stats||{};
  gi('dashContent').innerHTML = `
    <div class="stats-grid">
      <div class="stat"><div class="stat-lbl">Total Users</div><div class="stat-val" style="color:#7c6fff">${s.totalUsers||0}</div><div class="stat-sub" style="color:#7c6fff">👥 Reseller</div></div>
      <div class="stat"><div class="stat-lbl">Active</div><div class="stat-val" style="color:#2ecc71">${s.activeUsers||0}</div><div class="stat-sub" style="color:#2ecc71">✅ Active</div></div>
      <div class="stat"><div class="stat-lbl">Total Balance</div><div class="stat-val" style="color:#f39c12;font-size:1.2rem">Rs.${(s.totalBalance||0).toLocaleString()}</div><div class="stat-sub" style="color:#f39c12">💰 All Users</div></div>
      <div class="stat"><div class="stat-lbl">Pending W/D</div><div class="stat-val" style="color:#e74c3c">${s.pendingW||0}</div><div class="stat-sub" style="color:#e74c3c">⏳ Waiting</div></div>
      <div class="stat"><div class="stat-lbl">Pending Tasks</div><div class="stat-val" style="color:#f39c12">${s.pendingTasks||0}</div><div class="stat-sub" style="color:#f39c12">⏳ Review</div></div>
      <div class="stat"><div class="stat-lbl">Done Tasks</div><div class="stat-val" style="color:#2ecc71">${s.approvedTasks||0}</div><div class="stat-sub" style="color:#2ecc71">✅ Approved</div></div>
    </div>
    <div class="sec-title">Recent Withdrawals</div>
    ${(r.recentWithdrawals||[]).map(w=>`
      <div class="wrow">
        <div class="wrow-top"><span class="wrow-uid">${w.userId}</span><span class="wrow-amt">Rs.${w.amount}</span></div>
        <div class="wrow-info">${w.method||'-'}</div>
        <span class="badge ${w.status==='Approved'?'b-green':w.status==='Rejected'?'b-red':'b-yellow'}">${w.status||'Pending'}</span>
      </div>`).join('')||'<div class="empty">No recent withdrawals</div>'}
  `;
}

// ════════════════════════════
//  USERS
// ════════════════════════════
let usersData = [];
async function loadUsers() {
  gi('usersContent').innerHTML = loading();
  const r = await gGet('admin_get_users');
  usersData = r.data||[];
  renderUsers(usersData);
}
function renderUsers(data) {
  if(!data.length){gi('usersContent').innerHTML='<div class="empty">No users found</div>';return;}
  gi('usersContent').innerHTML = data.map(u=>`
    <div class="urow">
      <div class="urow-top">
        <div><div class="urow-name">${u.name||'-'}</div><div class="urow-id">${u.userId}</div></div>
        <span class="badge ${u.status==='Active'?'b-green':'b-red'}">${u.status||'Active'}</span>
      </div>
      <div class="urow-info">📞 ${u.phone||'-'} &nbsp;|&nbsp; 💰 Rs.${parseFloat(u.balance||0).toLocaleString()} &nbsp;|&nbsp; 🌍 ${u.country||'-'}</div>
      <div class="urow-btns">
        <button class="btn btn-blue" onclick='openEditUser(${JSON.stringify(u)})'>✏️ Edit</button>
        <button class="btn ${u.status==='Blocked'?'btn-green':'btn-yellow'}" onclick="toggleUser('${u.userId}','${u.status||'Active'}')">${u.status==='Blocked'?'✅ Unblock':'🚫 Block'}</button>
      </div>
    </div>`).join('');
}
function filterUsers() {
  const q = gi('uSearch').value.toLowerCase();
  renderUsers(usersData.filter(u=>
    (u.name||'').toLowerCase().includes(q)||
    (u.userId||'').toLowerCase().includes(q)||
    (u.phone||'').includes(q)
  ));
}
function openEditUser(u) {
  gi('mTitle').textContent = 'Edit User — '+u.userId;
  gi('mBody').innerHTML = `
    <div class="form-group"><label class="form-label">Name</label><input class="form-inp" id="eu_n" value="${u.name||''}"/></div>
    <div class="form-group"><label class="form-label">Phone</label><input class="form-inp" id="eu_p" value="${u.phone||''}"/></div>
    <div class="form-group"><label class="form-label">Balance (Rs.)</label><input class="form-inp" type="number" id="eu_b" value="${u.balance||0}"/></div>
    <div class="form-group"><label class="form-label">Status</label>
    <select class="form-select" id="eu_s"><option ${u.status==='Active'?'selected':''}>Active</option><option ${u.status==='Blocked'?'selected':''}>Blocked</option></select></div>
    <div class="form-group"><label class="form-label">Account No</label><input class="form-inp" id="eu_ano" value="${u.accountNo||''}"/></div>
    <div class="form-group"><label class="form-label">Account Type</label><input class="form-inp" id="eu_at" value="${u.accountType||''}"/></div>
  `;
  gi('mSave').onclick = async ()=>{
    const res = await gPost({action:'admin_update_user',userId:u.userId,
      name:v('eu_n'),phone:v('eu_p'),balance:v('eu_b'),status:v('eu_s'),
      accountNo:v('eu_ano'),accountType:v('eu_at')});
    closeModal(); toast(res.success?'✅ User updated!':'❌ '+res.error, res.success);
    if(res.success) loadUsers();
  };
  openModal();
}
async function toggleUser(uid, status) {
  const ns = status==='Blocked'?'Active':'Blocked';
  if(!confirm(`${uid} ko ${ns} karna?`)) return;
  const r = await gPost({action:'admin_update_user',userId:uid,status:ns});
  toast(r.success?`✅ ${ns}!`:'❌ Error', r.success);
  if(r.success) loadUsers();
}

// ════════════════════════════
//  WITHDRAWALS
// ════════════════════════════
async function loadWith() {
  gi('withContent').innerHTML = loading();
  const r = await gGet('admin_get_withdrawals');
  const d = r.data||[];
  if(!d.length){gi('withContent').innerHTML='<div class="empty">No withdrawals</div>';return;}
  gi('withContent').innerHTML = d.map(w=>`
    <div class="wrow">
      <div class="wrow-top"><span class="wrow-uid">${w.userId||'-'}</span><span class="wrow-amt">Rs.${w.netAmount||w.amount||0}</span></div>
      <div class="wrow-info">📱 ${w.method||'-'} &nbsp;|&nbsp; ${w.account||'-'}<br>Fee: Rs.${w.fee||0} &nbsp;|&nbsp; Net: Rs.${w.netAmount||0}</div>
      <div class="wrow-btns">
        <span class="badge ${w.status==='Approved'?'b-green':w.status==='Rejected'?'b-red':'b-yellow'}" style="margin-right:6px">${w.status||'Pending'}</span>
        ${w.status==='Pending'?`
          <button class="btn btn-green" onclick="actWith(${w.row},'Approved')">✅ Approve</button>
          <button class="btn btn-red" onclick="actWith(${w.row},'Rejected')">❌ Reject</button>
        `:''}
      </div>
    </div>`).join('');
}
async function actWith(row,status) {
  if(!confirm(`${status} karna?`)) return;
  const r = await gPost({action:'admin_update_withdrawal',row,status});
  toast(r.success?`✅ ${status}!`:'❌ '+r.error, r.success);
  if(r.success) loadWith();
}

// ════════════════════════════
//  TASKS
// ════════════════════════════
let tasksData = [], taskFilter = 'all';
async function loadTasks() {
  gi('tasksContent').innerHTML = loading();
  const r = await gGet('admin_get_tasks');
  tasksData = r.data||[];
  renderTasks();
}
function filterTasks(f) {
  taskFilter = f;
  renderTasks();
}
function renderTasks() {
  const d = taskFilter==='all' ? tasksData : tasksData.filter(t=>t.platform===taskFilter);
  if(!d.length){gi('tasksContent').innerHTML='<div class="empty">No submissions</div>';return;}
  gi('tasksContent').innerHTML = d.map(t=>`
    <div class="trow">
      <div class="trow-top">
        <span class="trow-name">${t.name||t.userId||'-'}</span>
        <span class="badge ${t.platform==='YouTube'?'b-red':t.platform==='Facebook'?'b-blue':'b-pink'}">${t.platform}</span>
      </div>
      <div class="trow-info">🆔 ${t.userId} &nbsp;|&nbsp; Task: ${t.taskId||'-'}<br>🕐 ${t.timestamp||'-'}</div>
      <div class="trow-btns">
        ${t.proofUrl?`<a class="btn btn-blue proof-link" href="${t.proofUrl}" target="_blank">📷 Proof</a>`:''}
        <span class="badge ${t.status==='Approved'?'b-green':t.status==='Rejected'?'b-red':'b-yellow'}" style="margin-left:4px">${t.status||'Pending'}</span>
        ${t.status==='Pending'?`
          <button class="btn btn-green" style="margin-left:auto" onclick="actTask(${t.row},'Approved','${t.tab}')">✅</button>
          <button class="btn btn-red" onclick="actTask(${t.row},'Rejected','${t.tab}')">❌</button>
        `:''}
      </div>
    </div>`).join('');
}
async function actTask(row,status,tab) {
  const r = await gPost({action:'admin_update_task',row,status,tab});
  toast(r.success?`✅ ${status}! Balance updated.`:'❌ '+r.error, r.success);
  if(r.success) loadTasks();
}

// ════════════════════════════
//  REWARD
// ════════════════════════════
let rwUser = null;
async function searchRewardUser() {
  const uid = gi('rwSearch').value.trim();
  if(!uid){toast('⚠️ User ID daalen',false);return;}
  gi('rwUserBox').style.display='none';
  gi('rwForm').style.display='none';
  const r = await gGet('admin_search_user',{userId:uid});
  if(r.success && r.user) {
    rwUser = r.user;
    gi('rwUserBox').innerHTML = `
      <div class="user-found-name">✅ ${r.user.name}</div>
      <div class="user-found-info">
        🆔 ${r.user.userId}<br>
        📞 ${r.user.phone}<br>
        💰 Balance: <b style="color:#2ecc71">Rs.${parseFloat(r.user.balance||0).toLocaleString()}</b><br>
        📌 ${r.user.status}
      </div>`;
    gi('rwUserBox').style.display='block';
    gi('rwForm').style.display='block';
  } else {
    rwUser=null;
    gi('rwUserBox').innerHTML=`<div style="color:var(--red)">❌ ${r.error||'Not found'}</div>`;
    gi('rwUserBox').style.display='block';
  }
}
async function sendReward() {
  if(!rwUser){toast('⚠️ Pehle user search karein',false);return;}
  const type = gi('rwType').value;
  const amt  = gi('rwAmt').value;
  if(!amt||parseFloat(amt)<=0){toast('⚠️ Amount daalen',false);return;}
  const r = await gPost({action:'admin_send_reward',userId:rwUser.userId,rewardType:type,amount:amt});
  if(r.success){
    toast(`✅ ${type} Rs.${amt} sent!`, true);
    gi('rwAmt').value='';
    // Update shown balance
    const b = gi('rwUserBox').querySelector('b');
    if(b) b.textContent='Rs.'+parseFloat(r.newBalance).toLocaleString();
  } else toast('❌ '+r.error, false);
}
async function updateBalance() {
  const uid = gi('balUid').value.trim();
  const amt = gi('balAmt').value.trim();
  if(!uid||!amt){toast('⚠️ ID aur amount daalen',false);return;}
  const r = await gPost({action:'admin_update_balance',userId:uid,balance:amt});
  toast(r.success?`✅ ${uid} → Rs.${amt}`:'❌ '+r.error, r.success);
}

// ════════════════════════════
//  HELPERS
// ════════════════════════════
function gi(id){return document.getElementById(id);}
function v(id){return gi(id)?.value||'';}
function loading(){return '<div class="loading"><div class="spin"></div><br>Loading...</div>';}
function openModal(){gi('modalBg').classList.add('open');}
function closeModal(){gi('modalBg').classList.remove('open');}
gi('modalBg').addEventListener('click',e=>{if(e.target===gi('modalBg'))closeModal();});
function toast(msg,ok=true){
  const t=gi('toast');
  t.textContent=msg;
  t.className=`toast show ${ok?'ok':'fail'}`;
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
